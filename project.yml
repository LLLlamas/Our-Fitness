# XcodeGen project definition.
# CI: generated by .github/workflows on every run (the .xcodeproj is gitignored).
# Local: run `xcodegen generate` after editing this file, then build in Xcode
# or via xcodebuild. Do not commit the generated .xcodeproj.

name: OurFitness
options:
  bundleIdPrefix: com.ourfitness
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  # objectVersion cap removed when upgrading to Xcode 26 (macos-26 runner).
  # XcodeGen will emit the project format native to the installed Xcode.
  # Re-add a floor if you need to support a specific older Xcode version again.

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # Strict concurrency = minimal during scaffolding. Bump to "complete" once the
    # surface area is stable and the Sendable churn is worth fixing.
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  OurFitness:
    type: application
    platform: iOS
    sources:
      - path: OurFitness
        excludes:
          - "**/.DS_Store"
      # Shared ActivityKit attributes — compiled into BOTH the app (to start/
      # update/end the Live Activity) and the OurFitnessWidgets extension (to
      # render it). Single source of truth; the file is #if canImport(ActivityKit)
      # gated so it's inert where the framework is absent.
      - path: Shared/LiveSessionAttributes.swift
      # Phone <-> watch wire format — compiled into BOTH the app (Services/
      # WatchSyncService.swift builds WatchSnapshotEnvelope and applies
      # WatchAction) and the OurFitnessWatch target. Pure Foundation, no
      # framework gating needed.
      - path: Shared/WatchSyncPayload.swift
    resources:
      - path: OurFitness/Assets.xcassets
      # Offline USDA FoodData Central SQLite/FTS5 database, bundled into the app
      # only (NOT the hostless test target — SQLiteFoodDatabase degrades to empty
      # there). Regenerated by scripts/build-food-db.py on CI (Python only).
      #
      # Do NOT add `Resources/usda-foods.db` to the `excludes:` list on the
      # `path: OurFitness` source entry above. XcodeGen applies that exclude to
      # the file globally, not just to the source phase, so the resource entry
      # here is silently dropped and the app ships with no food database at all
      # (SQLiteFoodDatabase then degrades to empty and search falls back to the
      # ~1,200 curated CommonFoods, with no build error). `.db` is not a
      # compilable type, so it never lands in Sources without the exclude —
      # the exclude bought nothing and cost the whole database.
      - path: OurFitness/Resources/usda-foods.db
    # No `info:` block — that would make XcodeGen regenerate Info.plist
    # on every `xcodegen generate`, wiping the orientations, HealthKit
    # usage strings, and UILaunchScreen we keep in the file. Xcode finds
    # the file via the INFOPLIST_FILE build setting below.
    #
    # Same rule for `entitlements:` — DO NOT add an `entitlements:` block
    # here. XcodeGen will write an empty plist to the path on every
    # `xcodegen generate`, clobbering our HealthKit / Background Delivery
    # entitlements. The archive will sign with only the 4 default keys
    # (application-identifier, beta-reports-active, team-identifier,
    # get-task-allow) and HealthKit silently drops out of the IPA — even
    # if the provisioning profile has HealthKit attached correctly.
    # CODE_SIGN_ENTITLEMENTS below points Xcode at the hand-written file.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ourfitness.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: OurFitness/Info.plist
        CODE_SIGN_ENTITLEMENTS: OurFitness/OurFitness.entitlements
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone/iPad only. Opt out of automatic "Designed for iPhone/iPad"
        # availability on Mac (Apple Silicon) and visionOS — HealthKit doesn't
        # exist on those platforms, and we don't want to ship there. Together
        # with omitting "healthkit" from UIRequiredDeviceCapabilities in
        # Info.plist, this clears ITMS-90863 + ITMS-90984.
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        # Manual signing — fastlane injects the right cert + profile in CI.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "OurFitness AppStore"
      configs:
        Debug:
          # Debug builds in the compile workflow run with CODE_SIGNING_ALLOWED=NO,
          # so leave these blank for Debug to avoid warnings in PR builds.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
    # Embed the widget extension AND the watch companion app into the app bundle.
    # Without `embed: true` the Live Activity has nowhere to render / the watch
    # app has nowhere to install, and App Store upload of a half-embedded
    # archive fails. Widget → Contents/PlugIns; watch app → Contents/Watch.
    dependencies:
      - target: OurFitnessWidgets
        embed: true
      - target: OurFitnessWatch
        embed: true

  # Widget extension hosting the Live Sessions ActivityKit Live Activity (Lock
  # Screen + Dynamic Island). No Home Screen widgets. The widget Info.plist is
  # hand-written (NSExtension → widgetkit-extension) and wired via INFOPLIST_FILE
  # — NO `info:`/`entitlements:` block, same XcodeGen-clobber trap as the app.
  # ActivityKit needs no entitlement; only the app's NSSupportsLiveActivities.
  OurFitnessWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: OurFitnessWidgets
        excludes:
          - "**/.DS_Store"
          # Info.plist is referenced via INFOPLIST_FILE, not compiled.
          - "Info.plist"
      # Same shared attributes file the app compiles — the contract between the
      # app (sender) and this extension (renderer).
      - path: Shared/LiveSessionAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ourfitness.app.widgets
        PRODUCT_NAME: OurFitnessWidgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: OurFitnessWidgets/Info.plist
        # App-extension targets must SKIP_INSTALL so `xcodebuild archive` embeds
        # the .appex inside the app rather than installing it as a standalone
        # product (a malformed archive otherwise fails App Store upload).
        SKIP_INSTALL: "YES"
        # Match the app: iPhone/iPad only, opt out of Mac/visionOS availability.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        # Manual signing — the widget needs its OWN App Store provisioning profile
        # (see docs/live-activity-setup.md). The placeholder below must match the
        # profile name the user generates; CI injects the right one.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "OurFitnessWidgets AppStore"
      configs:
        Debug:
          # Mirror the app: PR compile workflow runs with signing off.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"

  # watchOS companion app for the Reminders tab (single-target watch app, no
  # separate WatchKit extension). Thin client: no local SwiftData store — it
  # syncs with the iOS app over WatchConnectivity (Services/WatchSyncService.swift
  # on the phone side). Compiles the two pure-Foundation Domain files it needs
  # directly (mirrors how OurFitnessTests compiles OurFitness/Domain directly)
  # plus the shared wire format, instead of pulling in the whole Domain folder.
  # Same no-`info:`/`entitlements:`-block rule as every other target.
  OurFitnessWatch:
    type: application
    platform: watchOS
    sources:
      - path: OurFitnessWatch
        excludes:
          - "**/.DS_Store"
          # Info.plist is referenced via INFOPLIST_FILE, not compiled.
          - "Info.plist"
      # Individual Domain files compiled straight into the watch, the same way
      # OurFitnessTests compiles Domain directly. Each one MUST stay
      # dependency-free (Foundation only, no other Domain type) or it drags the
      # rest of Domain onto the wrist — CalorieEstimator.swift was split for
      # exactly this reason, see Domain/ExerciseCalories.swift.
      - path: OurFitness/Domain/PlantCatalog.swift
      - path: OurFitness/Domain/ReminderSchedule.swift
      - path: OurFitness/Domain/LiveSessionState.swift
      - path: OurFitness/Domain/ActivityCatalog.swift
      - path: OurFitness/Domain/CalorieEstimator.swift
      - path: Shared/WatchSyncPayload.swift
    resources:
      # The watch app needs its OWN asset catalog — it cannot borrow the app's,
      # because a watchOS AppIcon must be declared with `"platform": "watchos"`.
      # Without an AppIcon here, actool writes no CFBundleIconName into the watch
      # Info.plist and the IPA is rejected at upload with altool error 90713
      # ("Missing Info.plist value ... in the bundle com.ourfitness.app.watchkitapp"),
      # AFTER a full archive has already been built. See docs/watch-app-setup.md.
      - path: OurFitnessWatch/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ourfitness.app.watchkitapp
        PRODUCT_NAME: OurFitnessWatch
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: OurFitnessWatch/Info.plist
        # HealthKit for on-wrist workout sessions. Build SETTING, never an
        # `entitlements:` block — XcodeGen would regenerate and clobber the file.
        # NOTE: adding this capability invalidated the old watch App Store
        # profile; APPSTORE_WATCH_PROFILE_BASE64 must be regenerated with
        # HealthKit enabled on the App ID. See docs/watch-app-setup.md.
        CODE_SIGN_ENTITLEMENTS: OurFitnessWatch/OurFitnessWatch.entitlements
        # Embedded (not standalone) product, same reasoning as the widget extension.
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_PREVIEWS: "YES"
        # Names the app-icon set in OurFitnessWatch/Assets.xcassets. This setting
        # is what makes actool emit CFBundleIconName; the resource entry alone
        # is not enough.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Manual signing — the watch app needs its OWN App Store provisioning
        # profile (see docs/watch-app-setup.md). The placeholder below must
        # match the profile name the user generates; CI injects the right one.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "OurFitnessWatch AppStore"
      configs:
        Debug:
          # Mirror the app/widget: PR compile workflow runs with signing off.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: ""
          PROVISIONING_PROFILE_SPECIFIER: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"

  OurFitnessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OurFitnessTests
      - path: OurFitness/Domain
      # The phone<->watch wire format, so its encode/decode and
      # backward-compatibility rules are unit-testable. Pure Foundation, same as
      # everything else in this target.
      - path: Shared/WatchSyncPayload.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ourfitness.app.tests
        # Domain tests compile the pure OurFitness/Domain sources directly.
        # Keep them hostless so XCTest never launches the SwiftUI app lifecycle,
        # and never link through the app executable/debug dylib.
        TEST_HOST: ""
        BUNDLE_LOADER: ""
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  OurFitness:
    build:
      targets:
        OurFitness: all
        OurFitnessWidgets: all
        OurFitnessWatch: all
        OurFitnessTests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - OurFitness
      targets:
        - OurFitnessTests
    run:
      config: Debug
    archive:
      config: Release
